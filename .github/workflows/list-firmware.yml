name: list sheng firmware
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: list archive entries
        run: |
          set -euxo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 5 "https://bn.d.miui.com/OS3.0.305.0.WNXMIXM/sheng_global_images_OS3.0.305.0.WNXMIXM_20260914.0000.00_16.0_global_31450b6677.tgz" | tar -tzf - > out/entries.txt
          grep -Ei 'vendor|super|product|odm|images/' out/entries.txt | tail -80
      - uses: actions/upload-artifact@v4
        with:
          name: sheng-entries
          path: out/entries.txt
          if-no-files-found: error
